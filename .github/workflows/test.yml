name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — the suites run on stock Node.
      - name: Run test suites
        run: node test/run.js

      # Conflict markers carry a ref after them ("<<<<<<< HEAD"), so match the
      # 7-char prefix rather than requiring the marker alone on the line.
      - name: Check for merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)[ \t]|^=======$' -- \
               '*.md' '*.html' '*.js' '*.json' '*.yml'; then
            echo "::error::Merge-conflict markers found in tracked files"
            exit 1
          fi
          echo "No conflict markers found."
