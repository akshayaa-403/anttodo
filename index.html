<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐜 Ant To-Do List</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <h1 class="app-title">🐜 Ant To‑Do</h1>
            <button id="themeToggle" class="btn-icon" aria-label="Toggle dark/light theme">
                <span class="icon-dark">🌙</span>
                <span class="icon-light">☀️</span>
            </button>
        </div>
        <p class="tagline">Paste your list – let the colony find the smartest order.</p>
    </header>

    <main class="main-container">
        <!-- Input Section -->
        <section class="panel input-panel">
            <h2>📝 Your Tasks</h2>
            <textarea id="taskInput" placeholder="Buy groceries&#10;Reply to urgent email&#10;Finish project report – due tomorrow&#10;Call dentist&#10;…"></textarea>
            <div id="validationMessage" class="validation-message hidden"></div>
            <button id="optimizeBtn" class="btn-primary">🚀 Optimize with the Colony</button>
            <small class="hint">Paste a list of tasks, one per line. The clearier the better!</small>
        </section>

        <!-- Results Section -->
        <section class="panel results-panel" id="resultsPanel" style="display: none;">
            <div class="results-grid">
                <div class="list-col">
                    <h3>📋 Your Input</h3>
                    <ol id="originalList" class="task-list"></ol>
                </div>
                <div class="list-col">
                    <h3>✨ Optimised Order</h3>
                    <ol id="optimizedList" class="task-list"></ol>
                </div>
            </div>
            <div class="improvement-card">
                <span>🚀 Improvement</span>
                <span class="improvement-value" id="improvementValue">0%</span>
            </div>
        </section>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loader-content">
            <div class="ants-animation">🐜🐜🐜</div>
            <p class="loader-text">Ants are scouting…</p>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <p id="progressText" class="progress-info"></p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/aco.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
